[project]
name = "papertree-jobs"
version = "1.0.0"
description = "Durable job runner - jobs + job_steps with per-step checkpointing, retry, idempotency and cancellation. Stdlib only by design."
requires-python = ">=3.12"
dependencies = ["papertree-db"]

[tool.uv.sources]
papertree-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_jobs"]
