[project]
name = "papertree-document-ir"
version = "1.0.0"
description = "PaperIR canonical document representation - Pydantic models (generated), identity and geometry."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_document_ir"]
