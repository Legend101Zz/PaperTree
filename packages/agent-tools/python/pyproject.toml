[project]
name = "papertree-agent-tools"
version = "1.0.0"
description = "The read-only tool registry the agent runtime adapts: name -> JSON schema -> async callable, owned by this project so the runtime stays swappable. Stdlib only by design."
requires-python = ">=3.12"
dependencies = [
    "papertree-db",
    "papertree-document-ir",
    "papertree-retrieval",
    "papertree-memory",
    "papertree-prompts",
]

[tool.uv.sources]
papertree-db = { workspace = true }
papertree-document-ir = { workspace = true }
papertree-retrieval = { workspace = true }
papertree-memory = { workspace = true }
papertree-prompts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_agent_tools"]
artifacts = ["papertree_agent_tools/py.typed"]
