[project]
name = "papertree-db"
version = "1.0.0"
description = "PaperTree SQLite data layer - forward-only migrations and owner-scoped query helpers."
requires-python = ">=3.12"
dependencies = [
    "papertree-document-ir",
    "sqlite-vec>=0.1.6",
]

[tool.uv.sources]
papertree-document-ir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_db"]
