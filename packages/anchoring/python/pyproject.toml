[project]
name = "papertree-anchoring"
version = "1.0.0"
description = "Derive ADR-004 anchor selectors in Python (#72 option 2). The T0-T6 resolver stays in TypeScript - see papertree_anchoring/capture.py for why porting it is the thing to avoid."
requires-python = ">=3.12"
dependencies = [
    "papertree-document-ir",
]

[tool.uv.sources]
papertree-document-ir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_anchoring"]
artifacts = ["papertree_anchoring/py.typed"]
