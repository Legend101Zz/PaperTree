[project]
name = "papertree-memory"
version = "1.0.0"
description = "The four agent memory stores and the structural trust boundary between them - a read-only agent handle plus an authorizer, because SQLite has no GRANT. Stdlib only by design."
requires-python = ">=3.12"
dependencies = [
    "papertree-db",
]

[tool.uv.sources]
papertree-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_memory"]
artifacts = ["papertree_memory/py.typed"]
