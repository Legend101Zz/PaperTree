[project]
name = "papertree-prompts"
version = "1.0.0"
description = "The one prompt-construction function. Untrusted paper content is delimited, datamarked and declared non-authoritative in every prompt - no call site concatenates strings. Stdlib only by design."
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_prompts"]
artifacts = ["papertree_prompts/py.typed"]
