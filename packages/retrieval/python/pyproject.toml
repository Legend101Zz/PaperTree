[project]
name = "papertree-retrieval"
version = "1.0.0"
description = "Structure-aware retrieval and evidence-package assembly - the parse tree is the index, semantic search is the fallback. Stdlib only by design."
requires-python = ">=3.12"
dependencies = [
    "papertree-db",
    "papertree-document-ir",
]

[tool.uv.sources]
papertree-db = { workspace = true }
papertree-document-ir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_retrieval"]
artifacts = ["papertree_retrieval/py.typed"]
