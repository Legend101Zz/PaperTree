[project]
name = "papertree-api"
version = "1.0.0"
description = "The HTTP transport in front of PaperTreeDb and the parse job runner. A transport, not a rewrite."
requires-python = ">=3.12"
dependencies = [
    "papertree-document-ir",
    "papertree-db",
    "papertree-jobs",
    "papertree-document-worker",
    # The AI broker (reader release S5: threads, summary, the agent's internal paper tools).
    # Workspace members only, ZERO third-party packages:
    #
    #   agent-tools  the grounding verifier and the answer contract it reads and writes.
    #   memory       `AgentDataHandle` — the READ-ONLY, owner-bound handle the internal paper
    #                tools read through; see deps.py on why it takes a user_id.
    #   retrieval    `PaperIndex`, its LRU cache, the seed expansion and the BM25 search.
    #   prompts      `mint_datamark` and the datamarking renderer for everything the agent reads.
    #   anchoring    `capture_anchor`: the server-minted citation Anchors (#124).
    #
    # (Until S5 these served #76's `POST /papers/{id}/ask` and its Python tool loop, both gone.)
    "papertree-agent-tools",
    "papertree-memory",
    "papertree-retrieval",
    "papertree-prompts",
    "papertree-anchoring",
    # The only two runtime dependencies that are not already in this workspace, and the reason
    # each is here rather than being written by hand:
    #
    #   fastapi   — routing, request/response validation and OpenAPI over `pydantic`, which the
    #               lock ALREADY carries at 2.13.4 via papertree-document-ir. It brings
    #               `starlette` plus `anyio`/`sniffio`/`idna`/`certifi`-class transitives.
    #   uvicorn   — the ASGI server. Nothing serves ASGI otherwise, and `python -m papertree_api`
    #               with no way to run it is not a deliverable.
    #
    # Measured lockfile delta is in #74's PR body, per the root README's anti-slop rule 4 and the
    # `docling>=2.0` precedent (one line, 22 packages -> 100+).
    #
    # DELIBERATELY ABSENT: `python-jose[cryptography]` and `bcrypt`, which v1 used. See
    # infrastructure/migrations/0004_auth.sql for why; `hashlib.scrypt` and `secrets` are stdlib.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # Multipart bodies are how a PDF arrives. FastAPI raises at import time on a `File(...)`
    # parameter without it, so it is a runtime dependency rather than an optional extra.
    "python-multipart>=0.0.9",
    # PROMOTED from the dev group by the reader release's S0 (contracts.md §3.4): the API now
    # makes HTTP calls of its own — `GET /healthz` probes the agent, and S5's `agent_client.py`
    # streams `POST /v1/runs` with `httpx.AsyncClient`. It was already locked (Starlette's
    # TestClient is httpx-backed, which is why it was a dev dependency), so the lock gains no
    # package: the delta is this service's own dependency edges, recorded in the S0 report.
    "httpx>=0.27",
]

[tool.uv.sources]
papertree-document-ir = { workspace = true }
papertree-db = { workspace = true }
papertree-jobs = { workspace = true }
papertree-document-worker = { workspace = true }
papertree-agent-tools = { workspace = true }
papertree-memory = { workspace = true }
papertree-retrieval = { workspace = true }
papertree-prompts = { workspace = true }
papertree-anchoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertree_api"]
artifacts = ["papertree_api/py.typed"]
