[project]
name = "papertree"
version = "0.0.0"
description = "PaperTree v2 Python workspace root (virtual - not itself a distributable package)."
requires-python = ">=3.12"
dependencies = [
    "papertree-document-ir",
    "papertree-db",
    "papertree-jobs",
    "papertree-document-worker",
    "papertree-evaluation",
    # Epic 3 (F3.7/F3.8). `[tool.uv.workspace] members` already globs `packages/*/python`, so these
    # are discovered as members without editing that line; they are listed HERE because a member is
    # only installed into the root .venv if something depends on it, and `uv run pytest` collects
    # from the root .venv. A member that is not installed reports ZERO tests, and zero tests
    # collected is the vacuous green AGENTS.md §2 records three instances of.
    "papertree-memory",
    "papertree-prompts",
    "papertree-retrieval",
    "papertree-agent-tools",
]

# apps/api is the v1 application. It has its own pyproject.toml and uv.lock and is
# deliberately NOT a member of this workspace - Epic 0 builds alongside it, untouched.
#
# `services/*/python` was added by Epic 1 (see EPIC-01-RESULT.md and issue #45). It is the
# one edit outside Epic 1's declared ownership that the epic could not avoid: uv resolves a
# member only from this list, and `services/document-worker` cannot import papertree-db /
# papertree-jobs / papertree-document-ir from outside the workspace without acquiring its own
# second uv.lock and a second .venv - which is the apps/api arrangement, and is exactly the
# split that lets two halves of one repo drift onto different dependency sets.
[tool.uv.workspace]
members = ["packages/*/python", "services/*/python"]
exclude = ["apps/*"]

[tool.uv.sources]
papertree-document-ir = { workspace = true }
papertree-db = { workspace = true }
papertree-jobs = { workspace = true }
papertree-document-worker = { workspace = true }
papertree-evaluation = { workspace = true }
papertree-memory = { workspace = true }
papertree-prompts = { workspace = true }
papertree-retrieval = { workspace = true }
papertree-agent-tools = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
# "services" was added with the workspace member above: `uv run pytest` is the command CI
# runs, and a suite outside testpaths reports green by never executing. See EPIC-00-GATE §8's
# turbo-cache finding for the same failure in the other language.
testpaths = ["packages", "services"]
addopts = "-q"
# "slow" marks tests that satisfy an acceptance criterion LITERALLY (e.g. 20 parse runs) where
# a cheaper test already asserts the same property. Deselect with -m "not slow". They still run
# by default: a criterion nobody executes is a criterion nobody meets.
markers = ["slow: long-running acceptance runs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# PyMuPDF ships no type stubs. Until Epic 1 it was used only by the synthetic-PDF generator
# that produces packages/document-ir/test/fixtures-pdf/; it is now also the geometry library
# of services/document-worker. `ignore_missing_imports` makes every pymupdf expression `Any`,
# and `strict` still forbids returning one from a typed function - the worker therefore keeps
# pymupdf behind services/document-worker/python/papertree_document_worker/pdf.py, which is
# the only module that imports it and the only place the Any-to-concrete conversion happens.
[[tool.mypy.overrides]]
module = ["pymupdf", "fitz"]
ignore_missing_imports = true

# Docling is deliberately NOT in this workspace's lock (one `docling>=2.0` line took it from 22
# packages to 100+, because uv locks a group whether or not it installs it). It lives in an
# opt-in probe venv, and `docling_bridge.py` runs under THAT interpreter, never this one - so
# mypy checking the bridge here can never resolve the import and should not try.
[[tool.mypy.overrides]]
module = ["docling.*"]
ignore_missing_imports = true
