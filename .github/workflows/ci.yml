# EPIC-00 F0.8 — CI: typecheck · lint · unit tests · codegen-drift · fixture validation.
#
# Every command below was run on a developer machine before it was written here. The
# non-obvious ones and why they are shaped this way:
#
#   * `pnpm install --frozen-lockfile` is the guard that WORKSPACE MEMBERSHIP AND THE LOCKFILE
#     AGREE: adding or removing an importer without relocking fails this flag. It used to be
#     described here as the guard that apps/ stays OUT — that stopped being true in #28, which
#     brought apps/web IN deliberately; the assertion below was inverted to match. `uv sync
#     --locked` is the same lockfile guard for the uv workspace, and apps/api stays out of that
#     one for real (its own uv.lock, excluded in [tool.uv.workspace]). There is deliberately no
#     `paths-ignore: [apps/**]` — a paths-filtered workflow can never report a required status
#     check, which silently wedges PRs.
#
#   * CI now installs apps/web's ~650 extra packages. One of them, `canvas`, does NOT get built:
#     it is pdfjs-dist's optional Node-side renderer, it publishes no Node 22 prebuild, and its
#     node-gyp fallback fails at `configure` on this runner for want of cairo/pango headers.
#     Because it is optional that failure is non-fatal — the install would go green with a
#     node-gyp error wall inside it — so it is blocked deliberately in pnpm-workspace.yaml
#     `ignoredBuiltDependencies`, where the reason is written down. apps/web still reports
#     "✓ Compiled successfully" without it.
#
#   * better-sqlite3 and sqlite-vec are native. This repo is developed on darwin-arm64 and CI is
#     linux-x64, so both are smoke-tested in a dedicated step BEFORE the suites run. Without it a
#     native-load failure surfaces as a wall of unrelated test failures.
#
#   * Versions are pinned, not floated. Node 22 is ABI 127, which is the better-sqlite3 prebuild
#     CI downloads; pnpm comes from the root package.json `packageManager` field so there is one
#     source of truth; Python is pinned to 3.12 because pyproject only says ">=3.12" and there is
#     no .python-version, so an unpinned uv would happily resolve 3.14.

name: CI

# TRIGGERS (#25). `pull_request.branches` filters on the PR's *base*, not its head. The old
# list — [main, epic-0-spine] — meant every stacked PR based on another epic branch went
# untested: CI ran on 3 of Epic 0's 13 PRs. `epic-0-spine` no longer exists at all.
#
# `pull_request:` is therefore UNFILTERED, deliberately. The alternative — enumerating
# [main, epic-1-ingest, epic-2-reader, ...] — reintroduces exactly the same failure the day
# someone stacks a PR on a branch nobody remembered to add, and Wave 1's stacks are not
# nameable in advance. An unfiltered trigger cannot go stale.
#
# `push` stays filtered to [main]. Pushes to a PR head branch are already covered by the
# `pull_request` trigger's `synchronize` event, so an unfiltered `push` would only double
# every run; and `concurrency` cancels in-progress runs per ref, not across triggers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately. See the header note.
  NODE_VERSION: '22.23.0'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.15'
  # turbo and uv both phone home by default.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # ── TypeScript: typecheck · lint · unit tests · codegen drift ───────────────────────────────
  typescript:
    name: TypeScript (typecheck · lint · test · codegen drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: setup-node's pnpm cache calls `pnpm store path`.
      # No `version:` input — action-setup reads `packageManager` from the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # uv IS REQUIRED BY THE TYPESCRIPT JOB. `db/migrations.spec` proves the TypeScript and
      # Python migration runners agree on one schema by having each finish what the other
      # started, which means the TS suite shells out to `uv run python`. That test used to
      # `return` silently when uv was missing — i.e. it passed while checking nothing, in
      # precisely this job. It is fatal now, so uv has to actually be here.
      - name: Install uv (the TS suite's cross-language drift check shells out to it)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the Python workspace (same reason)
        run: uv sync --locked --all-packages

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # better-sqlite3's install script places its prebuilt binary and is allowlisted in
      # pnpm-workspace.yaml `onlyBuiltDependencies`. If pnpm ever stops honouring that, the
      # `new Database()` below throws here rather than 40 lines into the db test suite.
      - name: Preflight — native SQLite stack loads (better-sqlite3 + sqlite-vec)
        working-directory: packages/db
        run: |
          pnpm exec node --input-type=module -e "
          import Database from 'better-sqlite3';
          import * as sqliteVec from 'sqlite-vec';
          const db = new Database(':memory:');
          sqliteVec.load(db);
          const sqlite = db.prepare('select sqlite_version() as v').get().v;
          const vec = db.prepare('select vec_version() as v').get().v;
          db.exec('create virtual table t using vec0(embedding float[4])');
          console.log('node', process.version, process.platform + '-' + process.arch,
                      '| sqlite', sqlite, '| sqlite-vec', vec, '| vec0 table: ok');
          "

      # INVERTED BY #28, not deleted. This used to assert apps/ was NOT in the pnpm workspace.
      #
      # That assertion was only ever about apps/web. apps/api is Python — its own uv.lock,
      # excluded in pyproject's [tool.uv.workspace], and it has no package.json at all — so
      # `pnpm ls` could never have listed it whatever pnpm-workspace.yaml said. Re-aiming the old
      # job at apps/api would have left a check that cannot fail, which is the exact shape this
      # repo has already been bitten by twice: #26's fixture script that passed while validating
      # nothing, and the cross-language test that SKIPPED and reported green.
      #
      # apps/web is now a member on purpose, so the invariant worth guarding flipped with it. It
      # is no longer "apps/ stays out" but "the membership list is exactly what #28 decided":
      #   * papertree-web IS a member — so the door cannot silently close on Epic 2 again, which
      #     is the failure #28 was opened for;
      #   * nothing ELSE under apps/ is — so a future apps/<thing> becomes a workspace package
      #     only when somebody adds it to pnpm-workspace.yaml deliberately.
      #
      # `pnpm install --frozen-lockfile` above remains the other half of the guard: it fails if
      # a member is added without relocking.
      #
      # Deliberately NOT asserted: that apps/web/package-lock.json still exists. It does, and the
      # v1 npm path (`cd apps/web && npm ci`) still works — but Epic 2 is chartered to delete that
      # lockfile, and a CI assertion demanding it would force Epic 2 to edit this file, which it
      # does not own. That is precisely the deadlock #28 is about; do not re-create it.
      - name: Assert the pnpm workspace is packages/* plus apps/web — and nothing else under apps/
        run: |
          WORKSPACE_JSON="$(mktemp)"
          export WORKSPACE_JSON
          pnpm ls --recursive --depth -1 --json > "$WORKSPACE_JSON"
          pnpm exec node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const pkgs = JSON.parse(readFileSync(process.env.WORKSPACE_JSON, 'utf8'));
          for (const p of pkgs) console.log('  ' + p.name + '  ' + p.path);
          let failed = false;
          const web = pkgs.filter((p) => p.path.endsWith('/apps/web'));
          if (web.length !== 1) {
            console.log('::error title=apps/web left the pnpm workspace::' +
              'papertree-web is not a workspace member. Epic 2 builds the reader against ' +
              'packages/anchoring and packages/ui and cannot do that from outside the ' +
              'workspace — see #28. Restore the apps/web entry in pnpm-workspace.yaml.');
            failed = true;
          }
          const other = pkgs.filter((p) => p.path.includes('/apps/') && !p.path.endsWith('/apps/web'));
          if (other.length > 0) {
            console.log('::error title=an unexpected apps/ package joined the workspace::' +
              other.map((p) => p.path).join(', ') +
              ' — only apps/web is a member (#28). Add it to pnpm-workspace.yaml and to this ' +
              'assertion deliberately, or take it back out.');
            failed = true;
          }
          if (failed) process.exit(1);
          console.log('workspace membership is as #28 decided: apps/web in, nothing else under apps/');
          "

      # Runs BEFORE the suites, not after: the checkout is pristine at this point, so anything
      # `codegen` changes is unambiguously drift. Put it after `test` and a future test that
      # writes a file into the repo turns this into a confusing false failure.
      #
      # F0.3's acceptance test (document-ir/codegen-drift.spec) already compares in-process; this
      # is the on-disk half of the same claim, and it covers the PYTHON bindings too — one
      # `turbo run codegen` writes both.
      #
      # Whole-tree rather than a pathspec on purpose. `git status -- 'packages/*/src/generated'`
      # matches NOTHING (git's wildmatch requires the pattern to match the full path, and that
      # one stops at a directory), so it reports clean while checking nothing — verified.
      - name: Codegen drift — regenerating from the schema must produce no diff
        run: |
          pnpm run codegen
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error title=Codegen drift::Generated files are stale. Run 'pnpm run codegen' and commit the result."
            echo "--- git status ---"
            git status --porcelain --untracked-files=all
            echo "--- diff ---"
            git --no-pager diff
            exit 1
          fi
          echo "no drift: the working tree is identical after regenerating from the schema"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

  # ── Python: pytest · ruff · mypy ────────────────────────────────────────────────────────────
  python:
    name: Python (pytest · ruff · mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv has no moving `v9` tag, so this is pinned to the exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale, which is also what keeps apps/api (its own uv.lock,
      # excluded in [tool.uv.workspace]) from being pulled in.
      - name: Sync workspace
        run: uv sync --locked --all-packages

      # The Python suite's cross-language drift check shells out to the TypeScript migration
      # runner, so this job needs Node too. Without it that test SKIPPED, and a skip reports as
      # a pass — so CI certified a check it never ran. Caught by watching the first real CI run:
      # "717 passed, 1 skipped" here against 718 locally. The TypeScript job installs uv for the
      # mirror-image reason; the two jobs are deliberately symmetric.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies (for the cross-language drift check)
        run: pnpm install --frozen-lockfile

      - name: Preflight — sqlite-vec loads under uv-managed CPython
        run: |
          uv run python -c "
          import sqlite3, sqlite_vec, sys
          conn = sqlite3.connect(':memory:')
          conn.enable_load_extension(True)
          sqlite_vec.load(conn)
          conn.enable_load_extension(False)
          sqlite, = conn.execute('select sqlite_version()').fetchone()
          vec, = conn.execute('select vec_version()').fetchone()
          conn.execute('create virtual table t using vec0(embedding float[4])')
          print('python', sys.version.split()[0], sys.platform,
                '| sqlite', sqlite, '| sqlite-vec', vec, '| vec0 table: ok')
          "

      - name: Tests
        run: uv run pytest

      # `packages services` since Epic 1, which is the first epic to own code outside packages/.
      # A directory that is not named here is not linted, and unlinted code reports green — the
      # same shape as the cross-language check that SKIPPED and passed, noted two steps above.
      # The pytest half of this is `testpaths` in the root pyproject.
      - name: Lint
        run: uv run ruff check packages services

      - name: Format check
        run: uv run ruff format --check packages services

      # Globs rather than an explicit list so a new packages/<name>/python or
      # services/<name>/python is type-checked the day it lands instead of being silently skipped.
      - name: Typecheck
        run: uv run mypy packages/*/python services/*/python

  # ── Fixture validation (F0.7's gate) ────────────────────────────────────────────────────────
  # Its own job so its state is readable at a glance in the PR checks list. F0.7 landed the
  # fixtures in 4d1f67d, so this is a hard gate demanding exactly 3 schema-valid fixtures: an
  # empty, short or absent directory FAILS, and so does dropping the path argument below
  # (#26 — the script used to treat all of those as a pass that checked nothing).
  fixtures:
    name: Fixture validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ajv + ajv-formats are devDependencies of @papertree/document-ir; the validator loads them
      # through a require() rooted there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate golden fixtures against paperir-1.0.0.schema.json
        run: node .github/scripts/validate-fixtures.mjs packages/document-ir
