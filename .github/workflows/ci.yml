# EPIC-00 F0.8 — CI: typecheck · lint · unit tests · codegen-drift · fixture validation.
#
# Every command below was run on a developer machine before it was written here. The
# non-obvious ones and why they are shaped this way:
#
#   * `pnpm install --frozen-lockfile` is the guard that WORKSPACE MEMBERSHIP AND THE LOCKFILE
#     AGREE: adding or removing an importer without relocking fails this flag. It used to be
#     described here as the guard that apps/ stays OUT — that stopped being true in #28, which
#     brought apps/web IN deliberately; the assertion below was inverted to match. `uv sync
#     --locked` is the same lockfile guard for the uv workspace, and apps/api stays out of that
#     one for real (its own uv.lock, excluded in [tool.uv.workspace]). There is deliberately no
#     `paths-ignore: [apps/**]` — a paths-filtered workflow can never report a required status
#     check, which silently wedges PRs.
#
#   * CI now installs apps/web's ~650 extra packages. One of them, `canvas`, does NOT get built:
#     it is pdfjs-dist's optional Node-side renderer, it publishes no Node 22 prebuild, and its
#     node-gyp fallback fails at `configure` on this runner for want of cairo/pango headers.
#     Because it is optional that failure is non-fatal — the install would go green with a
#     node-gyp error wall inside it — so it is blocked deliberately in pnpm-workspace.yaml
#     `ignoredBuiltDependencies`, where the reason is written down. apps/web still reports
#     "✓ Compiled successfully" without it.
#
#   * sqlite-vec is native. This repo is developed on darwin-arm64 and CI is linux-x64, so it is
#     smoke-tested in a dedicated step BEFORE the Python suite runs. Without it a native-load
#     failure surfaces as a wall of unrelated test failures. (The TypeScript db twin and its
#     better-sqlite3 preflight were deleted in the reader release's S0, ADR-002 §5 / R5.)
#
#   * Versions are pinned, not floated. pnpm comes from the root package.json `packageManager`
#     field so there is one source of truth; Python is pinned to 3.12 because pyproject only says
#     ">=3.12" and there is no .python-version, so an unpinned uv would happily resolve 3.14.
#
#   * EVERY GATE RUNS, UNCACHED, AND A SKIP IS A FAILURE (#141, #118). Until the reader release CI
#     ran typecheck, lint, the unit tests and the codegen check, and nothing else: no prettier, no
#     `next build`, no browser, and ~220 corpus/fresh Python tests plus 10 stamp.spec tests that
#     SKIP when their PDFs are absent - and CI had none of them, so they skipped, green, forever.
#     The PDFs are gitignored (they are arXiv/ACL papers: fetched, not redistributed), so the jobs
#     below fetch them with the same scripts a developer runs, cache them with actions/cache keyed
#     on the committed sha256 files (a bumped checksum is a new key), and verify the checksums
#     whether the bytes came from the cache or the network. The jobs that depend on them then read
#     their own logs and FAIL if a "SKIPPED" notice or a corpus skip reason is in them: the
#     assertion is on the log because the green/red of a test runner cannot tell "ran" from
#     "skipped" (the vacuous-green AGENTS.md section 2 records three times).
#
#     Turbo's cache is never used in CI (no `turbo` remote cache and no `.turbo` restore), so a
#     task that "passed" passed here, on this commit.
#
#     Jobs are separate and parallel so the wall clock is the slowest job, not the sum:
#     typescript, python, prettier, web-build, e2e (plus the small fixtures and PR-base jobs).
#     `live-journey.yml` is a different workflow on purpose: it spends real money, so it runs only
#     on the `run-live` label or by hand.

name: CI

# TRIGGERS (#25). `pull_request.branches` filters on the PR's *base*, not its head. The old
# list — [main, epic-0-spine] — meant every stacked PR based on another epic branch went
# untested: CI ran on 3 of Epic 0's 13 PRs. `epic-0-spine` no longer exists at all.
#
# `pull_request:` is therefore UNFILTERED, deliberately. The alternative — enumerating
# [main, epic-1-ingest, epic-2-reader, ...] — reintroduces exactly the same failure the day
# someone stacks a PR on a branch nobody remembered to add, and Wave 1's stacks are not
# nameable in advance. An unfiltered trigger cannot go stale.
#
# `push` stays filtered to [main]. Pushes to a PR head branch are already covered by the
# `pull_request` trigger's `synchronize` event, so an unfiltered `push` would only double
# every run; and `concurrency` cancels in-progress runs per ref, not across triggers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately. See the header note.
  NODE_VERSION: '22.23.0'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.15'
  # turbo and uv both phone home by default.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # ── TypeScript: typecheck · lint · unit tests · codegen drift ───────────────────────────────
  typescript:
    name: TypeScript (typecheck · lint · test · codegen drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: setup-node's pnpm cache calls `pnpm store path`.
      # No `version:` input — action-setup reads `packageManager` from the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # INVERTED BY #28, not deleted. This used to assert apps/ was NOT in the pnpm workspace.
      #
      # That assertion was only ever about apps/web. apps/api is Python — its own uv.lock,
      # excluded in pyproject's [tool.uv.workspace], and it has no package.json at all — so
      # `pnpm ls` could never have listed it whatever pnpm-workspace.yaml said. Re-aiming the old
      # job at apps/api would have left a check that cannot fail, which is the exact shape this
      # repo has already been bitten by twice: #26's fixture script that passed while validating
      # nothing, and the cross-language test that SKIPPED and reported green.
      #
      # apps/web is now a member on purpose, so the invariant worth guarding flipped with it. It
      # is no longer "apps/ stays out" but "the membership list is exactly what #28 decided":
      #   * papertree-web IS a member — so the door cannot silently close on Epic 2 again, which
      #     is the failure #28 was opened for;
      #   * nothing ELSE under apps/ is — so a future apps/<thing> becomes a workspace package
      #     only when somebody adds it to pnpm-workspace.yaml deliberately.
      #
      # `pnpm install --frozen-lockfile` above remains the other half of the guard: it fails if
      # a member is added without relocking.
      #
      # #75 adds the archive/ clause. `archive/` is outside every workspace by CONSTRUCTION —
      # pnpm-workspace.yaml lists packages/*, services/* and the literal apps/web, so a top-level
      # archive/ is never globbed, and nothing had to be excluded to make that true. That is
      # exactly why it is asserted here: an invariant that holds by accident of glob shape is one
      # `packages: ['*']` away from silently ceasing to hold, and a v1 tree back inside the
      # workspace is 4,449 unlinted Python lines and 29 hidden type errors (measured, #75).
      #
      # Deliberately NOT asserted: that apps/web/package-lock.json still exists. It does, and the
      # v1 npm path (`cd apps/web && npm ci`) still works — but Epic 2 is chartered to delete that
      # lockfile, and a CI assertion demanding it would force Epic 2 to edit this file, which it
      # does not own. That is precisely the deadlock #28 is about; do not re-create it.
      - name: Assert the pnpm workspace is packages/* plus apps/web — nothing else under apps/, nothing under archive/
        run: |
          WORKSPACE_JSON="$(mktemp)"
          export WORKSPACE_JSON
          pnpm ls --recursive --depth -1 --json > "$WORKSPACE_JSON"
          pnpm exec node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const pkgs = JSON.parse(readFileSync(process.env.WORKSPACE_JSON, 'utf8'));
          for (const p of pkgs) console.log('  ' + p.name + '  ' + p.path);
          let failed = false;
          const web = pkgs.filter((p) => p.path.endsWith('/apps/web'));
          if (web.length !== 1) {
            console.log('::error title=apps/web left the pnpm workspace::' +
              'papertree-web is not a workspace member. Epic 2 builds the reader against ' +
              'packages/anchoring and packages/ui and cannot do that from outside the ' +
              'workspace — see #28. Restore the apps/web entry in pnpm-workspace.yaml.');
            failed = true;
          }
          const other = pkgs.filter((p) => p.path.includes('/apps/') && !p.path.endsWith('/apps/web'));
          if (other.length > 0) {
            console.log('::error title=an unexpected apps/ package joined the workspace::' +
              other.map((p) => p.path).join(', ') +
              ' — only apps/web is a member (#28). Add it to pnpm-workspace.yaml and to this ' +
              'assertion deliberately, or take it back out.');
            failed = true;
          }
          const archived = pkgs.filter((p) => p.path.includes('/archive/'));
          if (archived.length > 0) {
            console.log('::error title=a package under archive/ joined the workspace::' +
              archived.map((p) => p.path).join(', ') +
              ' — archive/ is v1 (#75) and is outside every workspace, gate and lint path. ' +
              'A member there is linted, typechecked and built, which is the whole thing the ' +
              'archive exists to stop. Remove its package.json or move it out of archive/.');
            failed = true;
          }
          if (failed) process.exit(1);
          console.log('workspace membership is as #28 decided: apps/web in, nothing else under ' +
            'apps/, and nothing under archive/ (' + pkgs.length + ' members examined)');
          "

      # Runs BEFORE the suites, not after: the checkout is pristine at this point, so anything
      # `codegen` changes is unambiguously drift. Put it after `test` and a future test that
      # writes a file into the repo turns this into a confusing false failure.
      #
      # F0.3's acceptance test (document-ir/codegen-drift.spec) already compares in-process; this
      # is the on-disk half of the same claim, and it covers the PYTHON bindings too — one
      # `turbo run codegen` writes both.
      #
      # Whole-tree rather than a pathspec on purpose. `git status -- 'packages/*/src/generated'`
      # matches NOTHING (git's wildmatch requires the pattern to match the full path, and that
      # one stops at a directory), so it reports clean while checking nothing — verified.
      - name: Codegen drift — regenerating from the schema must produce no diff
        run: |
          pnpm run codegen
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error title=Codegen drift::Generated files are stale. Run 'pnpm run codegen' and commit the result."
            echo "--- git status ---"
            git status --porcelain --untracked-files=all
            echo "--- diff ---"
            git --no-pager diff
            exit 1
          fi
          echo "no drift: the working tree is identical after regenerating from the schema"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # The live-parse specs (packages/anchoring s4-*, apps/web s4-table-cell-capture) run the
      # real worker through the workspace Python, so this job needs the venv as well as the PDFs.
      # stamp.spec stages the corpus PDFs through apps/web's `pretest`.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the Python workspace (the live-parse specs call it)
        run: uv sync --locked --all-packages

      # Fetched, not committed (arXiv/ACL licences). Cached on the committed checksum files, so the
      # network is touched only when a checksum changes or the cache is evicted.
      - name: Cache the benchmark PDFs (corpus + fresh set)
        uses: actions/cache@v6
        with:
          path: |
            research/benchmarks/corpus
            research/benchmarks/fresh/pdfs
          key: bench-pdfs-v1-${{ hashFiles('research/benchmarks/corpus.sha256', 'research/benchmarks/fresh/fresh.sha256') }}

      - name: Fetch the corpus and the fresh set, then verify their checksums
        run: |
          ./research/benchmarks/fetch_corpus.sh
          ./research/benchmarks/fresh/fetch_fresh.sh
          # fetch_corpus.sh prints FAIL and exits 0, so the checksum check is the real gate.
          (cd research/benchmarks/corpus && shasum -a 256 -c ../corpus.sha256)
          (cd research/benchmarks/fresh/pdfs && shasum -a 256 -c ../fresh.sha256)

      # `turbo run test` runs every workspace package's `test` script, @papertree/agent's included
      # (its isolation audit and mutants M5/M6); the next step asserts that from the log rather
      # than from this comment. NO_COLOR keeps the log greppable.
      - name: Unit tests
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          pnpm run test 2>&1 | tee "$RUNNER_TEMP/ts-test.log"

      - name: Assert the corpus-gated specs RAN and the agent tests ran (a skip is a failure)
        run: |
          log="$RUNNER_TEMP/ts-test.log"
          fail=0
          # ONE known, named skip is allowed: the agent's kernel-network-deny test on Linux. With
          # `unshare -rn` (the only Linux path in services/agent/test/run.ts) it FAILS rather than
          # skips: the child sees ENETUNREACH from the empty network namespace and the test
          # asserts /ERR EPERM/, which only macOS's sandbox-exec produces (measured in this job's
          # second run, #141). Enabling the namespace (AppArmor sysctl) therefore turns a loud skip
          # into a red; the one-line fix is in the test (accept ENETUNREACH), which this track does
          # not own. Until then the audit's other six controls run and this line is the only skip
          # tolerated; anything else printing SKIPPED fails the job.
          if /usr/bin/grep -a -n 'SKIPPED' "$log" | /usr/bin/grep -a -v 'SKIPPED LOUDLY: no kernel network deny'; then
            echo "::error title=A spec skipped::a corpus- or venv-gated spec printed SKIPPED (above)."
            fail=1
          fi
          if /usr/bin/grep -a -n -E 'Tests .*[0-9]+ skipped|^.*[[:space:]]↓ ' "$log"; then
            echo "::error title=vitest skipped tests::vitest reported skipped tests (above)."
            fail=1
          fi
          for want in 'test/stamp\.spec\.ts \(10 tests\)' 's4-table-cell-capture\.spec\.ts \(1 test\)' \
                      'the isolation audit' 'ℹ skipped [01]$'; do
            if ! /usr/bin/grep -a -q -E "$want" "$log"; then
              echo "::error title=Expected test output missing::no line matches: $want"
              fail=1
            fi
          done
          /usr/bin/grep -a -E 'stamp\.spec\.ts|s4-[a-z-]+\.spec\.ts|\[agent tests\]|ℹ (tests|pass|fail|skipped)' "$log" || true
          exit $fail

  # ── Python: pytest · ruff · mypy ────────────────────────────────────────────────────────────
  python:
    name: Python (pytest · ruff · mypy)
    runs-on: ubuntu-latest
    # The full suite is ~15 minutes on this runner once the corpus tests run (measured: 890 s).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv has no moving `v9` tag, so this is pinned to the exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale, which is also what keeps apps/api (its own uv.lock,
      # excluded in [tool.uv.workspace]) from being pulled in.
      - name: Sync workspace
        run: uv sync --locked --all-packages

      - name: Preflight — sqlite-vec loads under uv-managed CPython
        run: |
          uv run python -c "
          import sqlite3, sqlite_vec, sys
          conn = sqlite3.connect(':memory:')
          conn.enable_load_extension(True)
          sqlite_vec.load(conn)
          conn.enable_load_extension(False)
          sqlite, = conn.execute('select sqlite_version()').fetchone()
          vec, = conn.execute('select vec_version()').fetchone()
          conn.execute('create virtual table t using vec0(embedding float[4])')
          print('python', sys.version.split()[0], sys.platform,
                '| sqlite', sqlite, '| sqlite-vec', vec, '| vec0 table: ok')
          "

      # Fetched, not committed (arXiv/ACL licences). Cached on the committed checksum files, so the
      # network is touched only when a checksum changes or the cache is evicted.
      - name: Cache the benchmark PDFs (corpus + fresh set)
        uses: actions/cache@v6
        with:
          path: |
            research/benchmarks/corpus
            research/benchmarks/fresh/pdfs
          key: bench-pdfs-v1-${{ hashFiles('research/benchmarks/corpus.sha256', 'research/benchmarks/fresh/fresh.sha256') }}

      - name: Fetch the corpus and the fresh set, then verify their checksums
        run: |
          ./research/benchmarks/fetch_corpus.sh
          ./research/benchmarks/fresh/fetch_fresh.sh
          # fetch_corpus.sh prints FAIL and exits 0, so the checksum check is the real gate.
          (cd research/benchmarks/corpus && shasum -a 256 -c ../corpus.sha256)
          (cd research/benchmarks/fresh/pdfs && shasum -a 256 -c ../fresh.sha256)

      # -rs lists every skip with its reason, and the step reads that list. The corpus- and
      # fresh-gated tests (~220) skip with a reason naming their fetch script; seeing that here
      # means the fetch above did not produce what the tests look for.
      #
      # ONE TEST IS RUN IN ITS OWN PYTEST PROCESS. test_peak_rss_on_the_largest_paper_is_inside_
      # the_budget (75-page paper, 5 fresh subprocesses, 520 MB ratchet) skipped in CI until the
      # corpus was fetched here. In the full suite it failed on this Linux runner reading 710.5 MB
      # five times out of five (all five identical); run alone, in the same job, it PASSED (first
      # and second run of this job, #141). Identical values from five "fresh" subprocesses point
      # at the parent: Linux keeps ru_maxrss across fork+exec, so each child reports the pytest
      # process's own high-water mark by then (about 710 MB after ~2,000 tests), not its parse
      # (UNVERIFIED - the evidence is the pass-alone/fail-in-suite pair, not a trace). The test
      # is not this track's to loosen ("DO NOT RAISE THIS") or edit, so the suite deselects it and
      # it runs below in a fresh pytest process, where its own number is the number it reads. A
      # hard gate either way.
      - name: Tests
        run: |
          set -o pipefail
          uv run pytest -rs \
            --deselect services/document-worker/python/tests/worker/test_pipeline_end_to_end.py::test_peak_rss_on_the_largest_paper_is_inside_the_budget \
            2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Peak RSS ratchet (own pytest process)
        run: uv run pytest -rs services/document-worker/python/tests/worker/test_pipeline_end_to_end.py::test_peak_rss_on_the_largest_paper_is_inside_the_budget -s

      - name: Assert the corpus- and fresh-gated tests RAN (a skip is a failure)
        run: |
          log="$RUNNER_TEMP/pytest.log"
          tail -n 3 "$log"
          if /usr/bin/grep -a -n -E 'fetch_corpus\.sh|fetch_fresh\.sh|gitignored|corpus PDFs' "$log"; then
            echo "::error title=Corpus/fresh tests skipped::pytest skipped tests that need the fetched PDFs (lines above)."
            exit 1
          fi
          echo "skips that remain (none may be about the corpus or the fresh set):"
          /usr/bin/grep -a -E '^SKIPPED' "$log" || echo "  none"

      # `packages services` since Epic 1, which is the first epic to own code outside packages/.
      # A directory that is not named here is not linted, and unlinted code reports green — the
      # same shape as the cross-language check that SKIPPED and passed, noted two steps above.
      # The pytest half of this is `testpaths` in the root pyproject.
      - name: Lint
        run: uv run ruff check packages services

      - name: Format check
        run: uv run ruff format --check packages services

      # Globs rather than an explicit list so a new packages/<name>/python or
      # services/<name>/python is type-checked the day it lands instead of being silently skipped.
      - name: Typecheck
        run: uv run mypy packages/*/python services/*/python

  # ── Prettier (#141) ─────────────────────────────────────────────────────────────────────────
  # Its own job: it needs only node + the lockfile, so it finishes in a fraction of the
  # TypeScript job and a formatting slip is red in seconds, not after the whole suite.
  prettier:
    name: Prettier (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm exec prettier --check .

  # ── apps/web production build (#141) ────────────────────────────────────────────────────────
  # `tsc --noEmit` and `next lint` do not catch everything `next build` does (route/segment
  # config, server/client boundary errors, static generation failures). `prebuild` runs
  # copy-fixtures.mjs with --strict, which FAILS when the corpus PDFs are absent - so this job
  # needs them, and passing means the strict staging really found them.
  web-build:
    name: Web build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetched, not committed (arXiv/ACL licences). Cached on the committed checksum files, so the
      # network is touched only when a checksum changes or the cache is evicted.
      - name: Cache the benchmark PDFs (corpus + fresh set)
        uses: actions/cache@v6
        with:
          path: |
            research/benchmarks/corpus
            research/benchmarks/fresh/pdfs
          key: bench-pdfs-v1-${{ hashFiles('research/benchmarks/corpus.sha256', 'research/benchmarks/fresh/fresh.sha256') }}

      - name: Fetch the corpus and the fresh set, then verify their checksums
        run: |
          ./research/benchmarks/fetch_corpus.sh
          ./research/benchmarks/fresh/fetch_fresh.sh
          # fetch_corpus.sh prints FAIL and exits 0, so the checksum check is the real gate.
          (cd research/benchmarks/corpus && shasum -a 256 -c ../corpus.sha256)
          (cd research/benchmarks/fresh/pdfs && shasum -a 256 -c ../fresh.sha256)

      - name: Build papertree-web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter papertree-web build

  # ── Browser journeys A-D against the faux agent (#141) ──────────────────────────────────────
  # `pnpm e2e` starts the REAL api, worker and `next dev` on free ports against a fresh data
  # root, with the agent in FAUX mode (a scripted model: no key, no network). It runs whatever
  # specs exist under e2e/, so slices that add e2e/<slice>/ are picked up without editing this
  # file. PAPERTREE_E2E_YOLO_PDF is set so Journey B (and the S4 regression specs) RUN instead of
  # skipping; the step after the run reads the report and fails if any spec skipped.
  e2e:
    name: E2E (Playwright, faux agent)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The harness spawns `.venv/bin/python -m papertree_api` and `-m papertree_api.worker`.
      - name: Sync the Python workspace
        run: uv sync --locked --all-packages

      # Fetched, not committed (arXiv/ACL licences). Cached on the committed checksum files, so the
      # network is touched only when a checksum changes or the cache is evicted.
      - name: Cache the benchmark PDFs (corpus + fresh set)
        uses: actions/cache@v6
        with:
          path: |
            research/benchmarks/corpus
            research/benchmarks/fresh/pdfs
          key: bench-pdfs-v1-${{ hashFiles('research/benchmarks/corpus.sha256', 'research/benchmarks/fresh/fresh.sha256') }}

      - name: Fetch the corpus and the fresh set, then verify their checksums
        run: |
          ./research/benchmarks/fetch_corpus.sh
          ./research/benchmarks/fresh/fetch_fresh.sh
          # fetch_corpus.sh prints FAIL and exits 0, so the checksum check is the real gate.
          (cd research/benchmarks/corpus && shasum -a 256 -c ../corpus.sha256)
          (cd research/benchmarks/fresh/pdfs && shasum -a 256 -c ../fresh.sha256)

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e suite
        env:
          # The `runner` context is not available in job-level `env`, so these live on the step.
          PAPERTREE_E2E_SCRATCH: ${{ runner.temp }}/e2e-scratch
          PAPERTREE_E2E_OUTPUT: ${{ runner.temp }}/e2e-results
          PAPERTREE_E2E_YOLO_PDF: ${{ github.workspace }}/research/benchmarks/fresh/pdfs/yolo-1506.02640.pdf
        run: |
          set -o pipefail
          pnpm e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Assert no e2e spec skipped (Journey B needs the YOLO PDF)
        run: |
          cat "$RUNNER_TEMP/e2e.log" | tail -n 25
          if /usr/bin/grep -a -n -E '^[[:space:]]*[0-9]+ skipped' "$RUNNER_TEMP/e2e.log"; then
            echo "::error title=e2e specs skipped::a spec skipped (line above); the YOLO PDF or the faux agent is missing."
            exit 1
          fi

      # On failure only: Playwright's traces and screenshots (PAPERTREE_E2E_OUTPUT) and the
      # stack's data root with the api/worker/agent/web logs (PAPERTREE_E2E_SCRATCH). The data
      # root holds a throwaway SQLite file and the uploaded test PDF, never a key (the harness
      # passes none).
      - name: Upload e2e logs, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            ${{ runner.temp }}/e2e-results
            ${{ runner.temp }}/e2e-scratch
            ${{ runner.temp }}/e2e.log
          if-no-files-found: warn
          retention-days: 7

  # ── Fixture validation (F0.7's gate) ────────────────────────────────────────────────────────
  # Its own job so its state is readable at a glance in the PR checks list. F0.7 landed the
  # fixtures in 4d1f67d, so this is a hard gate demanding exactly 3 schema-valid fixtures: an
  # empty, short or absent directory FAILS, and so does dropping the path argument below
  # (#26 — the script used to treat all of those as a pass that checked nothing).
  fixtures:
    name: Fixture validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ajv + ajv-formats are devDependencies of @papertree/document-ir; the validator loads them
      # through a require() rooted there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate golden fixtures against paperir-1.0.0.schema.json
        run: node .github/scripts/validate-fixtures.mjs packages/document-ir

  # ── The stacked-merge trap (#81) ────────────────────────────────────────────────────────────
  #
  # Epic 3 shipped four PRs, all four reported MERGED, `main` received one, and it sat 12,564
  # lines short for a day while every signal was green. GitHub merged each PR into ITS STATED
  # BASE, and three of those bases were each other. See AGENTS.md §4 and #81.
  #
  # The ROOT CAUSE was the repo setting `deleteBranchOnMerge: false`, flipped to true by #81.
  # GitHub auto-retargets an open PR when its base branch is DELETED, so merging the bottom of
  # a stack now re-points the next PR at `main` on its own. These two jobs are the belt to that
  # braces — they assume the setting can be turned off again, or fail, or be worked around.
  #
  # BOTH RIDE THE EXISTING TRIGGERS. `pull_request:` above is unfiltered and `push:` is already
  # filtered to [main], which is exactly what these need, so the trigger block is untouched —
  # and so is the reasoning in its header, which nobody should undo without reading.

  # An ANNOTATION, never a failure. Stacking is legitimate and useful — Epic 3's four PRs were
  # reviewable BECAUSE they were stacked, and banning it fixes the wrong thing. The defect was
  # that the failure was silent, not that stacking happened. So this job says what to DO.
  #
  # No checkout: it reads the event payload and nothing else. Values reach bash through `env`
  # rather than `${{ }}` interpolation inside `run`, because a branch name is user-controlled
  # text and interpolating it into a shell script is a script-injection hole.
  pr-base-annotation:
    name: PR base (annotation only — never fails)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Note when this PR targets a branch other than main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          if [ "$BASE" = "main" ]; then
            echo "PR #$NUM targets main. Nothing to say."
            exit 0
          fi
          echo "::warning title=PR #$NUM is stacked on '$BASE', not main::\
          Merging this PR merges it INTO '$BASE' — NOT into main — and GitHub will still report \
          it as MERGED. That is the #81 trap: four PRs reported MERGED and main received one. \
          This is fine and stacking is supported, but the order matters. DO THIS: merge the PR \
          that owns '$BASE' FIRST and let its branch deletion auto-retarget this PR at main \
          (deleteBranchOnMerge is on, so that happens by itself). If you merge this one first, \
          verify afterwards with 'git fetch origin main && git merge-base --is-ancestor \
          <merge-commit> origin/main' — read that, not the MERGED badge. The post-merge guard \
          on push-to-main will catch it either way, but only at the next push to main."

  # The check that would actually have caught the incident. For every PR merged in the lookback
  # window, assert its merge commit is an ancestor of main.
  #
  # fetch-depth: 0 IS LOAD-BEARING. actions/checkout is shallow by default and
  # `git merge-base --is-ancestor` returns WRONG ANSWERS SILENTLY on a shallow history — the
  # script re-asserts this itself rather than trusting this line.
  #
  # Job-level `permissions:` REPLACES the workflow default, so `contents: read` is repeated
  # here deliberately; dropping it would break the checkout. `pull-requests: read` is what
  # `gh pr list` needs, and it is granted here rather than widening the workflow default.
  merged-prs-reached-main:
    name: Merged PRs actually reached main (#81)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every merged PR in the window is an ancestor of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/assert-merged-prs-reached-main.sh
