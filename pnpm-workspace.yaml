# PaperTree v2 workspace.
#
# apps/web IS a member (#28). The old comment here claimed that "pulling it into this
# workspace would change how it resolves dependencies" — that fear was measured and did
# NOT materialise: under pnpm's strict node_modules `next build` still reports
# "✓ Compiled successfully". Epic 2 owns apps/web/src/** and builds the reader against
# packages/anchoring and packages/ui, which is only possible from inside the workspace.
#
# apps/web keeps its own package-lock.json for now, so `cd apps/web && npm ci` still works
# for anyone on the v1 app. Two lockfiles for one package is a transitional state, not the
# target: EPIC 2 deletes apps/web/package-lock.json when v1 stops being deployable.
#
# apps/api is Python (its own uv.lock, excluded in pyproject's [tool.uv.workspace]) and has
# no package.json, so it is not and cannot be a pnpm package. `apps/*` is therefore listed
# as `apps/web` and not as a glob — a new apps/<something> joins the workspace only when
# somebody writes it here.
packages:
  - 'packages/*'
  - 'services/*'
  - 'apps/web'

# better-sqlite3 ships prebuilt binaries but needs its install script to place them.
# pnpm 10 blocks lifecycle scripts by default; this is the explicit allowlist.
onlyBuiltDependencies:
  - better-sqlite3
  # esbuild backs tsx (codegen) and vitest (tests); its postinstall places the binary.
  - esbuild
  # unrs-resolver is the native module resolver behind eslint-import-resolver-typescript,
  # which eslint-config-next loads; its postinstall places the platform binary.
  - unrs-resolver

# Blocked ON PURPOSE, so pnpm stops asking. Entries here are the answer to "why is this build
# script not allowlisted", and the answer must survive the next person who runs approve-builds.
ignoredBuiltDependencies:
  # canvas is pdfjs-dist@3.11's OPTIONAL Node-side renderer, reached via apps/web's react-pdf.
  # It was allowlisted first, and CI proved that wrong: canvas 2.11.2 predates Node 22, publishes
  # no v127 prebuild, and node-pre-gyp falls back to node-gyp — which fails at `configure` on
  # ubuntu-latest for want of cairo/pango headers (run 30565488280). Because canvas is optional
  # that failure is NON-FATAL: the install exits 0 and the job goes green with a 30-line node-gyp
  # error wall buried in it. A tolerated error that looks like a real one is worse than no error.
  # Nothing here imports canvas — apps/web renders PDFs in the BROWSER — and anything that did
  # would already be broken on linux-x64. If a server-side renderer is ever wanted, that is a
  # decision with a version bump attached, not an allowlist entry.
  - canvas
